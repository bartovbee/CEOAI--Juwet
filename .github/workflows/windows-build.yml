name: CEOAI Juwet Windows x64
on:
  push:
    branches: [main, fix/cache-behavior-integration, feature/auto-generate-ca, fix/tls-revocation-bypass, fix/restore-source-for-testing]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ceoai-juwet-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test source
        run: npm test
      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          npm run build:windows
      - name: Smoke test packaged Windows executable
        shell: pwsh
        run: ./tests/executable-smoke.ps1
      - name: Include source archive
        shell: pwsh
        run: |
          Copy-Item PETUNJUK-CA-HTTPS.txt dist\PETUNJUK-CA-HTTPS.txt -Force
          Compress-Archive -Path public,desktop,server.js,tls-inspection.js,package.json,data,README.md,tests,.github,Launch-CEOAI-Juwet.vbs,PETUNJUK-CA-HTTPS.txt -DestinationPath dist\CEOAI-Juwet-Source.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CEOAI-Juwet-Windows-x64
          path: |
            dist/CEOAI-Juwet.exe
            dist/CEOAI-Juwet-Source.zip
            dist/PETUNJUK-CA-HTTPS.txt
          if-no-files-found: error
          retention-days: 30
